server:
  port: 8080

spring:
  application:
    name: admisiones-service
  datasource:
    url: jdbc:postgresql://localhost:5432/admisiones_db
    username: admisiones
    password: admisiones
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
