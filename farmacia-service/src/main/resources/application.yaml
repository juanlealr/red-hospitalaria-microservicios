server:
  port: 8081

spring:
  application:
    name: farmacia-service
  datasource:
    url: ${FARMACIA_DB_URL:jdbc:postgresql://localhost:5433/farmacia_db}
    username: ${FARMACIA_DB_USER:farmacia}
    password: ${FARMACIA_DB_PASSWORD:farmacia}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true

farmacia:
  kafka:
    topic-solicitudes: farmacia.solicitudes
  outbox:
    intervalo-ms: 2000
  aseguradora:
    url: ${ASEGURADORA_URL:http://localhost:9095/api/aseguradora}
    connect-timeout-ms: 2000
    read-timeout-ms: 3000

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
