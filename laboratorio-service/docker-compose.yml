services:
  laboratorio-db:
    image: postgres:16
    container_name: laboratorio-db
    environment:
      POSTGRES_DB: laboratorio_db
      POSTGRES_USER: laboratorio
      POSTGRES_PASSWORD: laboratorio
    ports:
      # 5433 en el host: admisiones-db ya ocupa el 5432
      - "5433:5432"
    restart: always
