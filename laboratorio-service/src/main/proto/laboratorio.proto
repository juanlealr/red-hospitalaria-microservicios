syntax = "proto3";

// IMPORTANTE: este contrato debe mantenerse IDÉNTICO al de admisiones-service
// (mismo service, mismos métodos, mismos números de campo y SIN "package").
// Lo único que cambia entre los dos proyectos es java_package.
option java_package = "co.edu.uptc.laboratorio_service.grpc";
option java_multiple_files = true;

service LaboratorioGrpc {
  rpc VerificarOrdenesPendientes (OrdenesPendientesRequest) returns (OrdenesPendientesResponse) {}
}

message OrdenesPendientesRequest {
  string pacienteId = 1;
}

message OrdenesPendientesResponse {
  bool tienePendientes = 1;
}
