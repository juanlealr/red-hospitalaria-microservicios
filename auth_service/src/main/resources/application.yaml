# auth-service/src/main/resources/application.yaml
server:
  port: 8085

spring:
  application:
    name: auth-service
  datasource:
    url: ${AUTH_DB_URL:jdbc:postgresql://localhost:5436/auth_db}
    username: ${AUTH_DB_USER:auth}
    password: ${AUTH_DB_PASSWORD:auth}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

seguridad:
  admin-inicial:
    email: ${ADMIN_INICIAL_EMAIL:admin@hospital.com}
    password: ${ADMIN_INICIAL_PASSWORD:123456789}
  jwt:
    secret: ${JWT_SECRET}
    expiracion-ms: 7200000

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}

